<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاسات وتفاصيل - إنشاء حساب جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .global-gold-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(180deg, #f3cf65 0%, #d4af37 70%, #b89222 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .login-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            padding-top: 12px;
        }

        .form-section {
            flex: 1;
            background: linear-gradient(135deg, #111111 0%, #070707 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .form-box {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 35px 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .role-selector {
            display: flex;
            background: #1a1a1a;
            padding: 5px;
            border-radius: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: linear-gradient(45deg, #d4af37, #aa820a);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #d4af37;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: #666;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: #161616 !important;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff !important;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #d4af37, #aa820a);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .login-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
            margin-right: 5px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .info-section {
            flex: 1.2;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.88)), url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1200&auto=format&fit=crop') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
            border-right: 1px solid rgba(212, 175, 55, 0.1);
        }

        .info-content h1 {
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-content p {
            font-size: 18px;
            color: #b3b3b3;
            max-width: 500px;
            line-height: 1.8;
        }

        @media (max-width: 900px) {
            .info-section {
                display: none;
            }
        }
    
        .header-back-btn {
            background: rgba(0, 0, 0, 0.15) !important;
            border: 1px solid rgba(0, 0, 0, 0.3) !important;
            color: #000000 !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            font-size: 20px !important;
            transition: all 0.3s ease !important;
            flex-shrink: 0 !important;
            text-decoration: none !important;
            line-height: 1 !important;
        }
        .header-back-btn:hover {
            background: #000000 !important;
            color: #dbc38b !important;
            transform: scale(1.08) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4) !important;
        }
        .header-back-btn-dark {
            background: rgba(219, 195, 139, 0.15) !important;
            border: 1px solid #dbc38b !important;
            color: #dbc38b !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            font-size: 20px !important;
            transition: all 0.3s ease !important;
            flex-shrink: 0 !important;
            text-decoration: none !important;
            line-height: 1 !important;
        }
        .header-back-btn-dark:hover {
            background: #dbc38b !important;
            color: #000000 !important;
            transform: scale(1.08) !important;
            box-shadow: 0 4px 15px rgba(219, 195, 139, 0.4) !important;
        }
    
    </style>
</head>

<body>

    <div class="global-gold-bar"></div>

    <div class="login-container">
        <!-- واجهة التسجيل المنفصلة -->
        <div class="form-section">
            <div class="form-box">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="color: #d4af37; font-size: 24px; font-weight: 700; margin-bottom: 6px;">إنشاء حساب جديد
                    </h2>
                    <p style="color: #888; font-size: 13px;">قم بملء البيانات التالية للانضمام لتطبيق مقاسات وتفاصيل</p>
                </div>



                <!-- الاسم الكامل -->
                <div class="input-group">
                    <label for="nameInput">الاسم الكامل</label>
                    <div class="input-wrapper">
                        <input type="text" id="nameInput" placeholder="الاسم الثلاثي" autocomplete="off">
                        <i class="fas fa-user" style="left: 15px; right: auto;"></i>
                    </div>
                </div>

                <!-- البريد الإلكتروني -->
                <div class="input-group">
                    <label for="emailInput">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailInput" placeholder="Email" autocomplete="off" dir="ltr"
                            style="text-align: left; padding-left: 45px; padding-right: 15px;">
                        <i class="fas fa-envelope" style="left: 15px; right: auto;"></i>
                    </div>
                </div>

                <!-- رقم الهاتف -->
                <div class="input-group">
                    <label for="phoneInput">رقم الجوال</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phoneInput" placeholder="05xxxxxxxx" autocomplete="off" dir="ltr"
                            style="text-align: left; padding-left: 45px; padding-right: 15px;">
                        <i class="fas fa-phone" style="left: 15px; right: auto;"></i>
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div class="input-group">
                    <label for="passInput">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="passInput" placeholder="Password" autocomplete="off" dir="ltr"
                            style="text-align: left; padding-left: 45px; padding-right: 15px;">
                        <i class="fas fa-lock" style="left: 15px; right: auto;"></i>
                    </div>
                </div>

                <!-- رسالة الخطأ أو النجاح -->
                <div id="registerMsg"
                    style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-top: 10px;">
                </div>

                <!-- زر التسجيل -->
                <button type="button" class="submit-btn" onclick="handleRegister()">
                    <i class="fas fa-user-plus" style="margin-left: 8px;"></i>إنشاء الحساب
                </button>

                <!-- رابط العودة لصفحة تسجيل الدخول -->
                <div class="login-link">
                    لديك حساب بالفعل؟ <a href="login.html"><i class="fas fa-sign-in-alt"
                            style="margin-left: 4px;"></i>تسجيل الدخول</a>
                </div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-content">
                <h1>انضم إلينا اليوم</h1>
                <p>احصل على أفضل تجربة لتفصيل ملابسك وأخذ مقاساتك الرقمية بكل سهولة ودقة.</p>
            </div>
        </div>
    </div>

    <script>
        let selectedRole = 'Customer';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('customerRoleBtn').classList.toggle('active', role === 'Customer');
            document.getElementById('tailorRoleBtn').classList.toggle('active', role === 'Tailor');
        }

        async function handleRegister() {
            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const msgBox = document.getElementById('registerMsg');

            if (!name || !email || !password) {
                msgBox.style.display = 'block';
                msgBox.style.background = 'rgba(239, 68, 68, 0.15)';
                msgBox.style.border = '1px solid #ef4444';
                msgBox.style.color = '#fca5a5';
                msgBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> يرجى إدخال كافة البيانات المطلوبة';
                return;
            }

            try {
                const response = await fetch('/api/Users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password })
                });

                msgBox.style.display = 'block';
                msgBox.style.background = 'rgba(34, 197, 94, 0.15)';
                msgBox.style.border = '1px solid #22c55e';
                msgBox.style.color = '#86efac';
                msgBox.innerHTML = '<i class="fas fa-check-circle"></i> تم إنشاء الحساب بنجاح! جاري التوجيه لصفحة تسجيل الدخول...';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.style.background = 'rgba(34, 197, 94, 0.15)';
                msgBox.style.border = '1px solid #22c55e';
                msgBox.style.color = '#86efac';
                msgBox.innerHTML = '<i class="fas fa-check-circle"></i> تم إنشاء الحساب بنجاح! جاري التوجيه لصفحة تسجيل الدخول...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }
        }
    </script>
</body>

</html>
