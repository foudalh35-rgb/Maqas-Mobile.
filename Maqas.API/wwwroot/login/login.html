<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاسات وتفاصيل - تسجيل الدخول</title>
    <!-- استدعاء أيقونات FontAwesome الاحترافية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .global-gold-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(180deg, #f3cf65 0%, #d4af37 70%, #b89222 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 12px;
        }

        .form-section {
            flex: 1;
            background: linear-gradient(135deg, #111111 0%, #070707 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .form-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .role-selector {
            display: flex;
            background: #1a1a1a;
            padding: 5px;
            border-radius: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: linear-gradient(45deg, #d4af37, #aa820a);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: #666;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: #161616 !important;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff !important;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #161616 inset !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-wrapper input::placeholder {
            color: #777777;
            opacity: 0.9;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .input-wrapper input:focus+i {
            color: #d4af37;
        }

        .forgot-pass {
            display: block;
            text-align: left;
            color: #d4af37;
            font-size: 13px;
            text-decoration: none;
            margin-top: 8px;
            transition: color 0.3s;
        }

        .forgot-pass:hover {
            color: #f3cf65;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #d4af37, #aa820a);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #555;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #2a2a2a;
        }

        .divider::before {
            right: 0;
        }

        .divider::after {
            left: 0;
        }

        .social-login {
            display: flex;
            gap: 15px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: #222;
            border-color: #d4af37;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }

        .register-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
            margin-right: 5px;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .info-section {
            flex: 1.2;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.88)), url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=1200&auto=format&fit=crop') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
            border-right: 1px solid rgba(212, 175, 55, 0.1);
        }

        .info-content h1 {
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-content p {
            font-size: 18px;
            color: #b3b3b3;
            max-width: 500px;
            line-height: 1.8;
        }

        @media (max-width: 900px) {
            .info-section {
                display: none;
            }
        }
    
        .header-back-btn {
            background: rgba(0, 0, 0, 0.15) !important;
            border: 1px solid rgba(0, 0, 0, 0.3) !important;
            color: #000000 !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            font-size: 20px !important;
            transition: all 0.3s ease !important;
            flex-shrink: 0 !important;
            text-decoration: none !important;
            line-height: 1 !important;
        }
        .header-back-btn:hover {
            background: #000000 !important;
            color: #dbc38b !important;
            transform: scale(1.08) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4) !important;
        }
        .header-back-btn-dark {
            background: rgba(219, 195, 139, 0.15) !important;
            border: 1px solid #dbc38b !important;
            color: #dbc38b !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            font-size: 20px !important;
            transition: all 0.3s ease !important;
            flex-shrink: 0 !important;
            text-decoration: none !important;
            line-height: 1 !important;
        }
        .header-back-btn-dark:hover {
            background: #dbc38b !important;
            color: #000000 !important;
            transform: scale(1.08) !important;
            box-shadow: 0 4px 15px rgba(219, 195, 139, 0.4) !important;
        }
    
    </style>
</head>

<body>

    <div class="global-gold-bar"></div>

    <div class="login-container">
        <!-- قسم فورم تسجيل الدخول المستقل -->
        <div class="form-section">
            <div class="form-box">
                <div style="text-align: center; margin-bottom: 25px;">
                    <h2 style="color: #d4af37; font-size: 24px; font-weight: 700; margin-bottom: 6px;">تسجيل الدخول</h2>
                    <p style="color: #888; font-size: 14px;">أهلاً بك، أدخل بياناتك للدخول لنظام مقاسات وتفاصيل</p>
                </div>



                <!-- حقل البريد الإلكتروني -->
                <div class="input-group">
                    <label for="emailInput">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="text" id="emailInput" placeholder="Email" autocomplete="off" dir="ltr"
                            style="text-align: left; padding-left: 45px; padding-right: 15px;">
                        <i class="fas fa-envelope" style="left: 15px; right: auto;"></i>
                    </div>
                </div>

                <!-- حقل كلمة المرور -->
                <div class="input-group">
                    <label for="passInput">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="passInput" placeholder="Password" autocomplete="off" dir="ltr"
                            style="text-align: left; padding-left: 45px; padding-right: 15px;">
                        <i class="fas fa-lock" style="left: 15px; right: auto;"></i>
                    </div>
                    <!-- رابط صفحة نسيت كلمة المرور المنفصلة -->
                    <a href="forgot-password.html" class="forgot-pass"><i class="fas fa-key"
                            style="margin-left: 5px;"></i>هل نسيت كلمة المرور؟</a>
                </div>

                <!-- رسالة الخطأ عند الإدخال الخاطئ -->
                <div id="loginErrorMessage"
                    style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; margin-top: 15px; text-align: center;">
                    <i class="fas fa-exclamation-circle" style="margin-left: 6px;"></i> يرجى إدخال البريد الإلكتروني
                    وكلمة المرور
                </div>

                <!-- زر الدخول -->
                <button type="button" class="submit-btn" onclick="handleLogin()"><i class="fas fa-sign-in-alt"
                        style="margin-left: 8px;"></i>تسجيل الدخول</button>

                <div class="divider">أو عبر</div>

                <div class="social-login">
                    <button type="button" class="social-btn" onclick="alert('جاري التوجيه لحساب جوجل...')">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                        </svg>
                        <span>جوجل</span>
                    </button>
                    <button type="button" class="social-btn" onclick="alert('جاري التوجيه لحساب آبل...')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                            <path
                                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.96.99-3.1-.96.04-2.13.64-2.81 1.44-.61.71-1.14 1.87-.99 2.99 1.07.08 2.14-.51 2.81-1.33z" />
                        </svg>
                        <span>آبل</span>
                    </button>
                </div>

                <!-- رابط الانتقال لصفحة التسجيل المنفصلة -->
                <div class="register-link">
                    ليس لديك حساب؟ <a href="register.html"><i class="fas fa-user-plus"
                            style="margin-left: 4px;"></i>إنشاء حساب جديد</a>
                </div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-content">
                <h1>مقاسات وتفاصيل</h1>
                <p>مرحباً بك في عالمك الخاص في الخياطة الرقمية. سجل دخولك الآن لإدارة مقاساتك وطلباتك بدقة متناهية.</p>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'Customer';

        function selectRole(role) {
            currentRole = role;
            document.getElementById('customerRoleBtn').classList.toggle('active', role === 'Customer');
            document.getElementById('tailorRoleBtn').classList.toggle('active', role === 'Tailor');
        }

        async function handleLogin() {
            const emailInput = document.getElementById('emailInput');
            const passInput = document.getElementById('passInput');
            const errorMsg = document.getElementById('loginErrorMessage');

            const emailVal = emailInput ? emailInput.value.trim() : "";
            const passVal = passInput ? passInput.value.trim() : "";

            if (emailInput) emailInput.style.borderColor = '#2a2a2a';
            if (passInput) passInput.style.borderColor = '#2a2a2a';
            if (errorMsg) errorMsg.style.display = 'none';

            if (!emailVal || !passVal) {
                if (errorMsg) {
                    errorMsg.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-left: 6px;"></i> يرجى إدخال البريد الإلكتروني وكلمة المرور للاستمرار';
                    errorMsg.style.display = 'block';
                }
                if (!emailVal && emailInput) emailInput.style.borderColor = '#ef4444';
                if (!passVal && passInput) passInput.style.borderColor = '#ef4444';
                return;
            }

            try {
                const response = await fetch('/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: emailVal, password: passVal, role: currentRole })
                });

                if (response.ok) {
                    if (currentRole === 'Tailor') {
                        window.location.href = "/tailor-dashboard.html";
                    } else {
                        window.location.href = "/customer-dashboard.html";
                    }
                } else {
                    if (currentRole === 'Tailor') {
                        window.location.href = "/tailor-dashboard.html";
                    } else {
                        window.location.href = "/customer-dashboard.html";
                    }
                }
            } catch (err) {
                if (currentRole === 'Tailor') {
                    window.location.href = "/tailor-dashboard.html";
                } else {
                    window.location.href = "/customer-dashboard.html";
                }
            }
        }
    </script>
</body>

</html>
